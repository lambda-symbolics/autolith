syntax = "proto3";

package autolith.parent.v1;

import "autolith/common/v1/value.proto";

message Hello {
  repeated string features = 1;
}

message Limits {
  uint32 max_frame_bytes = 1;
  uint32 max_value_depth = 2;
  uint32 max_collection_entries = 3;
  uint32 max_in_flight_requests = 4;
}

message Ready {}

message TurnStart {
  string turn_id = 1;
  uint64 input_sequence = 2;
  bool continuation = 3;
  // Requires application.v1. Absent means an ordinary provider turn.
  ApplicationAction application = 4;
}

message TurnCancel {
  string turn_id = 1;
  string reason = 2;
}

message TurnFinish {
  string turn_id = 1;
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    COMPLETED = 1;
    CANCELLED = 2;
    FAILED = 3;
  }
  Outcome outcome = 2;
  uint64 last_session_sequence = 3;
}

message SessionRead {
  uint64 after_sequence = 1;
  uint32 limit = 2;
}

message SessionPage {
  repeated SessionRecord records = 1;
  uint64 high_water_sequence = 2;
  bool has_more = 3;
}

message SessionRecord {
  uint64 sequence = 1;
  string event_id = 2;
  string turn_id = 3;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    USER_INPUT = 1;
    ASSISTANT_MESSAGE = 2;
    TOOL_STARTED = 3;
    TOOL_FINISHED = 4;
    NOTE = 5;
    TURN_OUTCOME = 6;
  }
  Kind kind = 4;
  autolith.common.v1.Value payload = 5;
  enum Origin {
    ORIGIN_UNSPECIFIED = 0;
    PARENT = 1;
    AGENT = 2;
  }
  // Parent-controlled metadata. Agent appends must leave this unspecified.
  Origin origin = 6;
}

message SessionAppend {
  // Sequence must be zero; the parent assigns it after accepting the record.
  SessionRecord record = 1;
}

message SessionAck {
  string event_id = 1;
  uint64 sequence = 2;
}

message ModelStart {
  // Parent-configured profile; never a provider URL or credential selector path.
  string profile_id = 1;
  string turn_id = 2;
  repeated ConversationMessage messages = 3;
  repeated ToolDefinition tools = 4;
  optional uint32 max_output_tokens = 5;
  optional double temperature = 6;
  // Parent-issued handle for provider-specific continuation state.
  optional string continuation_handle = 7;
  // Requires model-items-v1. Do not combine items with messages.
  repeated TranscriptItem items = 8;
  repeated string stable_prefix = 9;
  repeated string request_suffix = 10;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    GENERATE = 1;
    NATIVE_COMPACTION = 2;
  }
  Kind kind = 11;
  // For reasoning settings, absence inherits the parent default. A present
  // empty string clears that default; other values must be profile choices.
  optional string reasoning_effort = 12;
  optional string reasoning_summary = 13;
  repeated HostedTool hosted_tools = 14;
  // Parent-issued per-user-turn routing state, not a raw provider token.
  optional string turn_state_handle = 15;
  optional bool tool_discovery = 16;
  // Requires model-items-v1. Request-local items follow durable items, before suffix.
  repeated TranscriptItem ephemeral_items = 17;
  enum Purpose {
    // Preserve ordinary generation and native compaction behavior when omitted.
    PURPOSE_UNSPECIFIED = 0;
    // Tool-free ordinary generation; not the native compaction operation.
    ORDINARY_SUMMARY = 1;
  }
  // Requires model-items-v1. ORDINARY_SUMMARY is valid only with GENERATE.
  Purpose purpose = 18;
}

message ConversationMessage {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    SYSTEM = 1;
    USER = 2;
    ASSISTANT = 3;
    TOOL = 4;
  }
  Role role = 1;
  repeated ContentBlock content = 2;
}

message ContentBlock {
  oneof content {
    string text = 1;
    Media media = 2;
    ToolCall tool_call = 3;
    ToolResult tool_result = 4;
    string reasoning_text = 5;
  }
}

message Media {
  // Inline content only, subject to frame limits. No parent-side path or URL fetch.
  string media_type = 1;
  bytes data = 2;
}

message ToolDefinition {
  string name = 1;
  string description = 2;
  autolith.common.v1.ValueMap input_schema = 3;
  string namespace = 4;
  string namespace_description = 5;
  bool deferred = 6;
  optional bool strict = 7;
}

message ToolCall {
  string call_id = 1;
  string name = 2;
  autolith.common.v1.ValueMap arguments = 3;
  string namespace = 4;
  // Exactly one argument representation; preserve malformed provider JSON.
  optional string arguments_json = 5;
}

message ToolResult {
  string call_id = 1;
  autolith.common.v1.Value content = 2;
  bool is_error = 3;
}

// Parent profile IDs select hosted tools; no transport configuration is accepted.
message HostedTool {
  string capability_id = 1;
}

// New input items are logical data. Replay refers to an unchanged parent item.
message TranscriptItem {
  oneof item {
    ConversationMessage message = 1;
    ToolCall tool_call = 2;
    ToolResult tool_result = 3;
    ToolDiscoveryResult tool_discovery_result = 4;
    string replay_handle = 5;
  }
}

message ToolDiscoveryResult {
  string call_id = 1;
  repeated ToolDefinition tools = 2;
}

// The handle is authoritative for replay; the view is for agent reasoning/UI.
// Parent retains the original item, including signatures and encrypted content.
message OutputItem {
  uint32 item_index = 1;
  string replay_handle = 2;
  string family = 3;
  oneof view {
    ConversationMessage message = 4;
    ToolCall tool_call = 5;
    ToolCall tool_discovery_call = 6;
    ReasoningView reasoning = 7;
    HostedToolView hosted_tool = 8;
    CompactionView compaction = 9;
  }
}

message ReasoningView {
  string text = 1;
}

message HostedToolView {
  string capability_id = 1;
  string status = 2;
  repeated ContentBlock content = 3;
}

message CompactionView {
  optional string summary = 1;
}

message ResponseMetadata {
  optional string model = 1;
  optional string finish_reason = 2;
  optional uint64 cache_write_tokens = 3;
  bool usage_observed = 4;
}

message AttemptStarted {
  uint32 maximum_attempts = 1;
  // Zero for the first attempt; delay before a retry begins.
  uint64 delay_milliseconds = 2;
}

message ModelProgress {
  string phase = 1;
  string text = 2;
}

message ModelEvent {
  uint64 index = 1;
  oneof event {
    TextDelta text_delta = 2;
    ToolCallDelta tool_call_delta = 3;
    ModelComplete complete = 4;
    Failure failed = 5;
    OutputItem item_completed = 6;
    ResponseMetadata metadata = 7;
    AttemptStarted attempt_started = 8;
    AttemptFailed attempt_failed = 9;
    ModelProgress progress = 10;
  }
  // One-based attempt identity; index remains monotonic across all attempts.
  uint32 attempt = 11;
}

message TextDelta {
  uint32 block_index = 1;
  string text = 2;
  bool reasoning = 3;
}

message ToolCallDelta {
  uint32 block_index = 1;
  string call_id = 2;
  string name = 3;
  string arguments_json_delta = 4;
  string namespace = 5;
  bool tool_discovery = 6;
}

message Usage {
  optional uint64 input_tokens = 1;
  optional uint64 output_tokens = 2;
  optional uint64 cached_input_tokens = 3;
  optional uint64 cache_write_tokens = 4;
  // Exact bounded portable usage object from the provider, not request options.
  autolith.common.v1.ValueMap provider_usage = 5;
}

message ModelComplete {
  ConversationMessage message = 1;
  Usage usage = 2;
  enum Reason {
    REASON_UNSPECIFIED = 0;
    STOP = 1;
    TOOL_CALLS = 2;
    OUTPUT_LIMIT = 3;
    FILTERED = 4;
  }
  Reason reason = 3;
  optional string continuation_handle = 4;
  // With model-items-v1, message is absent and output_items is authoritative.
  repeated OutputItem output_items = 5;
  optional string response_id = 6;
  ResponseMetadata metadata = 7;
  enum TurnCompletion {
    TURN_COMPLETION_UNSPECIFIED = 0;
    ENDED = 1;
    CONTINUED = 2;
  }
  TurnCompletion turn_completion = 8;
  optional string turn_state_handle = 9;
  enum CompactionOutcome {
    COMPACTION_OUTCOME_UNSPECIFIED = 0;
    COMPACTED = 1;
    UNSUPPORTED = 2;
  }
  CompactionOutcome compaction_outcome = 10;
}

message CancelRequest {
  uint64 request_id = 1;
}

message CancelAck {
  // This acknowledges delivery, not a terminal result for the target request.
  bool already_terminal = 1;
}

message RecordRequest {
  enum Collection {
    COLLECTION_UNSPECIFIED = 0;
    MEMORY = 1;
    PAPERCUT = 2;
    AGENDA = 3;
  }
  Collection collection = 1;
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    QUERY = 1;
    CREATE = 2;
    REPLACE = 3;
    DELETE = 4;
    ASSESS = 5;
    CLOSE = 6;
  }
  Operation operation = 2;
  string operation_id = 3;
  optional string record_id = 4;
  optional string expected_revision = 5;
  optional string query = 6;
  optional string cursor = 7;
  uint32 limit = 8;
  autolith.common.v1.ValueMap fields = 9;
  optional string expected_collection_revision = 10;
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    WORKSPACE = 1;
    GLOBAL = 2;
  }
  // Requires record-scopes-v1. Omission preserves the attached service scope.
  optional Scope scope = 11;
}

message StoredRecord {
  string record_id = 1;
  string revision = 2;
  autolith.common.v1.ValueMap fields = 3;
}

message RecordResponse {
  repeated StoredRecord records = 1;
  optional string next_cursor = 2;
  optional string collection_revision = 3;
}

// Requires knowledge.v1. Fixed operations over parent-authorized knowledge only.
message KnowledgeRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    READ = 1;
    EDIT = 2;
    CHECK = 3;
    RECORD = 4;
    CONTEXT = 5;
    EXPAND = 6;
  }
  Operation operation = 1;
  string operation_id = 2;
  RecordRequest.Scope scope = 3;
  // Public memory: identifier, never a pathname.
  string view = 4;
  optional string expected_revision = 5;
  optional string query = 6;
  uint32 limit = 7;
  // EDIT operations, CHECK tool/arguments, or RECORD handle/result.
  autolith.common.v1.ValueMap fields = 8;
}

message KnowledgeResponse {
  string content = 1;
  optional string revision = 2;
  autolith.common.v1.ValueMap fields = 3;
}

message Grant {
  enum Resource {
    RESOURCE_UNSPECIFIED = 0;
    FILESYSTEM = 1;
    NETWORK = 2;
    SERVICE = 3;
  }
  Resource resource = 1;
  string target = 2;
  repeated string operations = 3;
  enum Duration {
    DURATION_UNSPECIFIED = 0;
    INSTANCE = 1;
    SESSION = 2;
  }
  Duration duration = 4;
}

message AccessRequest {
  string operation_id = 1;
  repeated Grant requested_grants = 2;
  string reason = 3;
}

message AccessDecision {
  enum State {
    STATE_UNSPECIFIED = 0;
    PENDING_APPROVAL = 1;
    DENIED = 2;
    APPROVED_PENDING_RESTART = 3;
    ACTIVE = 4;
    FAILED = 5;
    EXPIRED = 6;
  }
  State state = 1;
  uint64 policy_revision = 2;
  repeated Grant effective_grants = 3;
  string explanation = 4;
}

message PrepareStop {
  string reason = 1;
  uint32 grace_milliseconds = 2;
  uint64 next_policy_revision = 3;
}

message ReadyToStop {
  uint64 last_session_sequence = 1;
  optional string wrap_up_event_id = 2;
}

message Output {
  enum Channel {
    CHANNEL_UNSPECIFIED = 0;
    PROGRESS = 1;
    DIAGNOSTIC = 2;
  }
  Channel channel = 1;
  string text = 2;
}

message Failure {
  enum Code {
    CODE_UNSPECIFIED = 0;
    INVALID_REQUEST = 1;
    PERMISSION_DENIED = 2;
    REVISION_CONFLICT = 3;
    UNSUPPORTED = 4;
    RESOURCE_LIMIT = 5;
    CANCELLED = 6;
    UNAVAILABLE = 7;
    INTERNAL = 8;
  }
  Code code = 1;
  string message = 2;
  bool retryable = 3;
}


message AttemptFailed {
  uint64 elapsed_seconds = 1;
  bool output_received = 2;
  bool retryable = 3;
  Failure failure = 4;
}

message Welcome {
  string session_id = 1;
  uint64 policy_revision = 2;
  repeated Grant active_grants = 3;
  repeated string features = 4;
  Limits limits = 5;
  autolith.common.v1.ValueMap configuration = 6;
  // Parent-owned resume data, never a Lisp heap or an agent-provided authority record.
  SessionPage resume = 7;
}

// Parent input is inert data. Only the child may read or evaluate SOURCE.
message ApplicationAction {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    COMMAND = 1;
    LISP = 2;
    ASYNC_LISP = 3;
    CATALOG = 4;
    COMPLETION = 5;
    MESSAGE = 6;
    RUN_JOB = 7;
    ACP_PROMPT = 8;
    ACP_EXTENSION = 9;
    CONFIGURE = 10;
    PUMP = 11;
  }
  Kind kind = 1;
  string source = 2;
  uint32 cursor = 3;
  repeated string image_paths = 4;
  autolith.common.v1.ValueMap job = 5;
}

// Metadata comes from the live child command registry, never parent name tables.
message ApplicationCommand {
  string name = 1;
  repeated string aliases = 2;
  string argument = 3;
  string description = 4;
  string tip = 5;
  enum BusyBehavior {
    BUSY_UNSPECIFIED = 0;
    HOLD = 1;
    INSPECT = 2;
    EXECUTE = 3;
    APPLY = 4;
    CANCEL = 5;
  }
  BusyBehavior busy_behavior = 6;
  enum TerminalBehavior {
    TERMINAL_UNSPECIFIED = 0;
    SHARED = 1;
    EXCLUSIVE = 2;
    EXCLUSIVE_WITHOUT_ARGUMENTS = 3;
  }
  TerminalBehavior terminal_behavior = 7;
  repeated string options = 8;
  bool callable = 9;
}

message ApplicationResult {
  string turn_id = 1;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    OK = 1;
    ABORTED = 2;
    ERROR = 3;
  }
  Status status = 2;
  string output = 3;
  repeated string values = 4;
  string condition = 5;
  repeated ApplicationCommand commands = 6;
  repeated string completions = 7;
  bool quit = 8;
  repeated ApplicationCompletion completion_entries = 9;
  autolith.common.v1.ValueMap job = 10;
  autolith.common.v1.ValueMap fields = 11;
}

message ApplicationCompletion {
  string name = 1;
  string argument = 2;
  string description = 3;
  string primary = 4;
}

// FIFO parent-created scope inside the current provider turn.
message ApplicationSteering {
  string turn_id = 1;
  string operation_id = 2;
  uint64 input_sequence = 3;
  ApplicationAction action = 4;
}

// Presentation only. The parent validates the fixed kind and inert content.
message ApplicationEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    TEXT = 1;
    REASONING = 2;
    STATUS = 3;
    TOOL_STARTED = 4;
    TOOL_FINISHED = 5;
    PRESENTATION = 6;
    ACP = 7;
    UI = 8;
  }
  Kind kind = 1;
  autolith.common.v1.ValueMap fields = 2;
}

// A bounded wakeup. The parent schedules its known completion pump in a fresh scope.
message ApplicationNotification {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    ACP_COMPLETION_READY = 1;
    UI_COMPLETION_READY = 2;
  }
  Kind kind = 1;
  string identifier = 2;
}

// Fixed parent operations. Arguments are bounded data, not Lisp source.
message ParentOperation {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    AUTH = 1;
    MODEL = 2;
    PREFERENCES = 3;
    PERMISSIONS = 4;
    SESSION = 5;
    RESTART = 6;
    MCP = 7;
    WEB = 8;
  }
  Kind kind = 1;
  string turn_id = 2;
  autolith.common.v1.ValueMap arguments = 3;
  string operation_id = 4;
}

message ParentOperationResult {
  autolith.common.v1.ValueMap fields = 1;
}

// Private supervisor-agent protocol, not a remote-control service.
// Directions, validation, durability, and restart rules: docs/parent-agent-protocol.org.
message Envelope {
  uint32 protocol_major = 1;
  string instance_id = 2;
  uint64 message_id = 3;
  optional uint64 reply_to = 4;
  oneof body {
    Hello hello = 10;
    Welcome welcome = 11;
    Ready ready = 12;
    TurnStart turn_start = 13;
    TurnCancel turn_cancel = 14;
    TurnFinish turn_finish = 15;
    SessionRead session_read = 16;
    SessionPage session_page = 17;
    SessionAppend session_append = 18;
    SessionAck session_ack = 19;
    ModelStart model_start = 20;
    ModelEvent model_event = 21;
    CancelRequest cancel_request = 22;
    CancelAck cancel_ack = 23;
    RecordRequest record_request = 24;
    RecordResponse record_response = 25;
    AccessRequest access_request = 26;
    AccessDecision access_decision = 27;
    PrepareStop prepare_stop = 28;
    ReadyToStop ready_to_stop = 29;
    Failure failure = 30;
    Output output = 31;
    KnowledgeRequest knowledge_request = 32;
    KnowledgeResponse knowledge_response = 33;
    ApplicationResult application_result = 34;
    ParentOperation parent_operation = 35;
    ParentOperationResult parent_operation_result = 36;
    ApplicationSteering application_steering = 37;
    ApplicationEvent application_event = 38;
    ApplicationNotification application_notification = 39;
  }
}
