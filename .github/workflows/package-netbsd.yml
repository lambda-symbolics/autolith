name: Package NetBSD

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      provision_only:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      provision_only:
        description: Only install and verify the build dependencies
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package:
    name: Package NetBSD x86-64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PROVISION_ONLY: ${{ inputs.provision_only }}
    steps:
      - name: Validate release tag
        run: '[[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Validate release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          test "v$version" = "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" >/dev/null

      - name: Package and validate NetBSD release
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10"
          mem: 8192
          envs: RELEASE_TAG PROVISION_ONLY
          cache-after-prepare: false
          prepare: |
            set -eu
            export PATH="/usr/pkg/bin:/usr/pkg/sbin:$PATH"
            # Resolve exact package versions from pkg_summary, then validate all downloads
            # before installing them. A failed Rust transfer must not leave partial packages.
            repository=${PKG_PATH:-https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/x86_64/10.2/All}
            repository_path=${repository#*://}
            repository_path=${repository_path#*/}
            set -- bash curl git gmake rust cmake zstd sbcl pkgconf coreutils gtar icu mozilla-rootcerts
            prepared=false
            for mirror in "$repository" \
                "https://ftp.NetBSD.org/$repository_path" \
                "https://ftp.fr.netbsd.org/$repository_path"; do
              export PKG_PATH="$mirror" PKG_REPOS="$mirror"
              if pkg_add -u pkgin && pkgin -f -y update && pkgin -y -d install "$@"; then
                prepared=true
                break
              fi
              if command -v pkgin >/dev/null 2>&1; then
                pkgin -y clean || true
              fi
            done
            if [ "$prepared" != true ]; then
              printf '%s\n' 'NetBSD build dependency downloads failed on every mirror.' >&2
              exit 1
            fi
            pkgin -y install "$@"
            pkg_info -e 'pcre2-[0-9]*'
            if [ ! -d /etc/openssl/certs ] || [ -z "$(ls -A /etc/openssl/certs 2>/dev/null)" ]; then
              mozilla-rootcerts install
            fi
          run: |
            set -eu
            export PATH="$HOME/bin:/usr/pkg/bin:/usr/local/bin:$PATH"
            if [ "$PROVISION_ONLY" = true ]; then
              rustc --version
              cmake --version
              gmake --version
              sbcl --version
              exit 0
            fi
            ./script/ci-package-release dist/
            release_name=autolith-"$RELEASE_TAG"-x86_64-netbsd
            (cd dist && sha256sum -c "$release_name.tar.gz.sha256")
            smoke_root=$(mktemp -d)
            tar -xzf "dist/$release_name.tar.gz" -C "$smoke_root"
            launcher="$smoke_root/$release_name/bin/autolith"
            export HOME="$smoke_root/home"
            export XDG_DATA_HOME="$smoke_root/data"
            export XDG_STATE_HOME="$smoke_root/state"
            export XDG_CONFIG_HOME="$smoke_root/config"
            export XDG_CACHE_HOME="$smoke_root/cache"
            export AUTOLITH_NO_UPDATE_CHECK=1
            mkdir -p "$HOME"
            trap '"$launcher" stop >"$smoke_root/stop" 2>&1 || true; rm -rf "$smoke_root"' EXIT HUP INT TERM
            "$launcher" --version > "$smoke_root/version"
            cat "$smoke_root/version"
            grep -F "${RELEASE_TAG#v}" "$smoke_root/version"
            printf '(shell.run :command "printf netbsd-shell-ok > %s/marker")\n' "$smoke_root" > "$smoke_root/input"
            status=0
            "$launcher" --permissions full < "$smoke_root/input" > "$smoke_root/output" 2>&1 || status=$?
            cat "$smoke_root/output"
            test "$status" -eq 0
            test "$(cat "$smoke_root/marker")" = netbsd-shell-ok
            test -s "$XDG_DATA_HOME/autolith/tasks/shell-log-accounting.sexp"
            "$launcher" stop

      - name: Upload NetBSD release artifacts
        if: ${{ !inputs.provision_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/autolith-"$RELEASE_TAG"-x86_64-netbsd.tar.gz \
            dist/autolith-"$RELEASE_TAG"-x86_64-netbsd.tar.gz.sha256 \
            --clobber
