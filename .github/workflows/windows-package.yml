name: Windows Qlot probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        digest-buffer: [default, md5, both]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install build dependencies
        shell: pwsh
        run: |
          choco install llvm cmake make emacs --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Build dependency installation failed.' }
          & emacs.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'The native Emacs test dependency is unavailable.' }
          if (-not (Get-Command cargo.exe -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
            & "$env:RUNNER_TEMP\rustup-init.exe" -y --profile minimal --default-toolchain 1.97.1
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: Bootstrap with shared caches
        id: bootstrap
        uses: ./.github/actions/windows-bootstrap

      - name: Check native bundle publication and ACLs
        shell: pwsh
        run: script\check-windows-sandbox-bundle.ps1 -Root (Join-Path $env:RUNNER_TEMP 'bundle-check')
      - name: Check with Qlot phase markers
        shell: pwsh
        env:
          ASDF_OUTPUT_TRANSLATIONS: ${{ steps.bootstrap.outputs.asdf-output-translations }}
          PROBE_QLOT_BUFFER: ${{ matrix.digest-buffer }}
        run: |
          $qlotRoot = Join-Path $env:USERPROFILE 'quicklisp\local-projects\qlot'
          & git -C $qlotRoot log -1 --format='%H %s'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify Qlot revision.' }
          & git -C $qlotRoot diff --name-only
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify Qlot patches.' }
          & git apply --ignore-space-change script/probe-windows-qlot.patch
          if ($LASTEXITCODE -ne 0) { throw 'Cannot apply the late probe patch.' }

          $env:AUTOLITH_QLOT_PROBE_DIR = Join-Path $env:RUNNER_TEMP 'autolith-qlot-probe'
          $null = New-Item -ItemType Directory -Path $env:AUTOLITH_QLOT_PROBE_DIR
          Remove-Item Env:QLOT_NO_CACHE -ErrorAction SilentlyContinue
          $status = 1
          try {
            & script\check.ps1 --timeout 1800 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'check.log')
            if ($null -ne $LASTEXITCODE) { $status = $LASTEXITCODE }
          } finally {
            foreach ($name in 'installer.log', 'progress.log', 'powershell.log') {
              $log = Join-Path $env:AUTOLITH_QLOT_PROBE_DIR $name
              Write-Host "== $name =="
              if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 100 }
            }
            Get-WinEvent -FilterHashtable @{
              LogName = 'Application'; Id = 1000; StartTime = (Get-Date).AddHours(-1)
            } -ErrorAction SilentlyContinue | Where-Object {
              $_.Message -match 'sbcl\.exe|powershell\.exe'
            } | Select-Object -First 5 TimeCreated, Message | Format-List
          }
          exit $status

      - name: Retain phase markers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qlot-digest-${{ matrix.digest-buffer }}
          path: ${{ runner.temp }}/autolith-qlot-probe/*.log
          if-no-files-found: ignore
          retention-days: 3
