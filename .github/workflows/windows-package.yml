name: Windows Clifff package proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-clifff:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CANDIDATE: 31bb830092900389a9f9c0a499d2de8dc08e9116
      CLIFFF_COMMIT: 128b6441f04f9eae626ceb4250903388270c24c5
      FFF_COMMIT: 9a7b1c8fc1d20236a255bf3ddb24eeb761bd6bd9
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify overlay and check out the exact package source
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') { throw 'Dispatch required.' }
          $parentLine = git rev-list --parents -n 1 HEAD
          if ($LASTEXITCODE -ne 0 -or $parentLine -cne "$env:GITHUB_SHA $env:CANDIDATE") {
            throw 'Expected the dispatch SHA to be a single-parent overlay on the candidate.'
          }
          git diff --quiet $env:CANDIDATE HEAD -- . ':(exclude).github/workflows/windows-package.yml' ':(exclude).github/workflows/windows-clifff-smoke.lisp'
          if ($LASTEXITCODE -ne 0) { throw 'Overlay changes the production tree.' }

          $root = Join-Path $env:RUNNER_TEMP 'clifff-proof'
          New-Item -ItemType Directory -Path $root | Out-Null
          $source = Join-Path $root 'source'
          git worktree add --detach $source $env:CANDIDATE
          if ($LASTEXITCODE -ne 0) { throw 'Candidate checkout failed.' }
          $revision = git -C $source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -cne $env:CANDIDATE) { throw 'Wrong candidate checkout.' }
          $fffPin = (Get-Content -Raw -LiteralPath (Join-Path $source 'native\fff\commit')).Trim()
          if ($fffPin -cne $env:FFF_COMMIT) { throw 'Unexpected FFF source pin.' }
          $lock = Get-Content -Raw -LiteralPath (Join-Path $source 'qlfile.lock')
          $clifffPin = [regex]::Match($lock, '(?s)\("clifff"\s*\.\s*\(:class\s+qlot/source/git:source-git\s+:initargs\s*\(:remote-url\s+"https://github\.com/lambda-symbolics/clifff\.git"\s+:ref\s+"([0-9a-f]{40})"\)')
          if (-not $clifffPin.Success -or $clifffPin.Groups[1].Value -cne $env:CLIFFF_COMMIT) {
            throw 'Unexpected Clifff lock pin.'
          }
          "candidate=$revision clifff=$env:CLIFFF_COMMIT fff=$fffPin"
          "CLIFFF_PROOF_ROOT=$root" >> $env:GITHUB_ENV

      - name: Install build dependencies
        shell: pwsh
        run: |
          choco install llvm cmake make --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Build dependency installation failed.' }
          if (-not (Get-Command cargo.exe -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
            & "$env:RUNNER_TEMP\rustup-init.exe" -y --profile minimal --default-toolchain 1.97.1
            if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
            "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH
          }

      - name: Bootstrap and build one canonical Windows package
        shell: pwsh
        run: |
          $source = Join-Path $env:CLIFFF_PROOF_ROOT 'source'
          Remove-Item Env:XDG_DATA_HOME, Env:XDG_CACHE_HOME, Env:XDG_STATE_HOME -ErrorAction SilentlyContinue
          $env:LOCALAPPDATA = Join-Path $env:CLIFFF_PROOF_ROOT 'build-home'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA | Out-Null
          Push-Location $source
          try {
            & .\script\bootstrap.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Candidate bootstrap failed.' }
            git diff --quiet HEAD --
            if ($LASTEXITCODE -ne 0) { throw 'Bootstrap modified tracked candidate files.' }
            $tag = 'v' + (Get-Content -Raw -LiteralPath VERSION).Trim() + "-dev.$env:GITHUB_RUN_NUMBER"
            & .\script\package-windows-release.ps1 -OutputDirectory dist -Tag $tag
            $archives = @(Get-ChildItem -File -LiteralPath dist -Filter '*.zip')
            if ($archives.Count -ne 1) { throw 'Expected exactly one package ZIP.' }
            & .\script\validate-windows-release-artifact.ps1 -Archive $archives[0].FullName
            "CLIFFF_PROOF_ARCHIVE=$($archives[0].FullName)" >> $env:GITHUB_ENV
          } finally {
            Pop-Location
          }

      - name: Verify packaged DLL and exercise the search worker
        shell: pwsh
        run: |
          $root = $env:CLIFFF_PROOF_ROOT
          $stage = Join-Path $root 'unpacked'
          Expand-Archive -LiteralPath $env:CLIFFF_PROOF_ARCHIVE -DestinationPath $stage
          $release = Join-Path $stage ([IO.Path]::GetFileNameWithoutExtension($env:CLIFFF_PROOF_ARCHIVE))
          $packaged = Join-Path $release 'libexec\autolith'
          if ((Get-Content -LiteralPath (Join-Path $release 'RELEASE')) -cnotcontains "commit=$env:CANDIDATE") {
            throw 'Archive provenance does not match the exact candidate.'
          }
          $dll = (Get-Item -LiteralPath (Join-Path $release 'native\fff_c.dll')).FullName
          $built = @(Get-ChildItem -Recurse -File -LiteralPath (Join-Path $root 'build-home\autolith\data\native\fff') -Filter '*.dll')
          $dllHash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash
          if ($built.Count -ne 1 -or $dllHash -cne (Get-FileHash -LiteralPath $built[0].FullName -Algorithm SHA256).Hash) {
            throw 'Packaged DLL does not match the single canonical bootstrap DLL.'
          }
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $built[0].DirectoryName 'manifest.sexp')
          if ($manifest -cnotmatch ('^\s*\(:FFF-LIBRARY\s+:VERSION\s+1\s+:COMMIT\s+"' + $env:FFF_COMMIT + '"\)\s*$')) {
            throw 'Bootstrap DLL manifest does not record the pinned FFF source.'
          }
          "package=$env:CLIFFF_PROOF_ARCHIVE fff_dll=$dll sha256=$dllHash"

          Remove-Item Env:XDG_DATA_HOME, Env:XDG_CACHE_HOME, Env:XDG_STATE_HOME -ErrorAction SilentlyContinue
          $env:LOCALAPPDATA = Join-Path $root 'search-home'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA | Out-Null
          $env:SBCL_HOME = Join-Path $release 'runtime'
          $env:AUTOLITH_SBCL = (Get-Item -LiteralPath (Join-Path $env:SBCL_HOME 'sbcl.exe')).FullName
          $env:AUTOLITH_FFF_LIBRARY = $dll
          $env:AUTOLITH_PROJECT_SETUP = (Get-Item -LiteralPath (Join-Path $packaged '.qlot\setup.lisp')).FullName
          $env:PATH = "$(Join-Path $release 'native');$env:PATH"
          $probe = Join-Path $env:GITHUB_WORKSPACE '.github\workflows\windows-clifff-smoke.lisp'
          $worker = Join-Path $packaged 'bin\autolith-search-worker'
          Push-Location $packaged
          try {
            & $env:AUTOLITH_SBCL --script $probe $worker $env:LOCALAPPDATA
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Clifff search smoke failed.' }
          } finally {
            Pop-Location
            $log = Join-Path $env:LOCALAPPDATA 'worker.log'
            if (Test-Path -LiteralPath $log) { Get-Content -Tail 80 -LiteralPath $log }
          }
          # Also exercise Windows filesystem access after both worker cycles close.
          Rename-Item -LiteralPath (Join-Path $env:LOCALAPPDATA 'index') -NewName 'closed-index'
          'CLIFFF PASS: private native cache can be renamed after shutdown.'
