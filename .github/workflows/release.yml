name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish-metadata:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate tag
        shell: bash
        run: |
          version=$(sed -n 's/^  :version "\([0-9][0-9.]*\)"$/\1/p' autolith.asd)
          test "v$version" = "$GITHUB_REF_NAME"
          test -s "docs/releases/$GITHUB_REF_NAME.md"

      - name: Publish GitHub release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
              --title "Autolith ${GITHUB_REF_NAME#v}"
          fi

  package-linux-x86_64:
    name: Package Linux x86-64
    needs: publish-metadata
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04@sha256:c664f8f86ed5a386b0a340d981b8f81714e21a8b9c73f658c4bea56aa179d54a
    timeout-minutes: 75
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            binutils bubblewrap build-essential ca-certificates cmake curl file git \
            libicu-dev libssl-dev libz-dev libzstd-dev pkg-config sbcl
          mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg |
            tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" |
            tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes gh
          git config --system --add safe.directory '*'

      - uses: actions/checkout@v5

      - name: Configure safe directory
        run: git config --global --add safe.directory '*'

      - name: Install Rust
        run: |
          curl --fail --location --show-error --retry 3 --proto '=https' --tlsv1.2 \
            https://sh.rustup.rs |
            sh -s -- -y --default-toolchain 1.97.1 --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Package Linux release
        run: ./script/ci-package-release dist/

      - name: Validate Linux release
        run: |
          ./script/validate-linux-release-artifact \
            dist/autolith-"$GITHUB_REF_NAME"-x86_64-linux.tar.gz \
            x86_64-linux x86_64 /lib64/ld-linux-x86-64.so.2

      - name: Upload Linux release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/autolith-"$GITHUB_REF_NAME"-x86_64-linux.tar.gz \
            dist/autolith-"$GITHUB_REF_NAME"-x86_64-linux.tar.gz.sha256 \
            --clobber

  package-linux-aarch64:
    name: Package Linux aarch64
    needs: publish-metadata
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:20.04@sha256:722ea796ac2d57eeb3627c58a582fc1acc58be51faf815e1bce1682ae5c092f7
    timeout-minutes: 90
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            binutils bubblewrap build-essential ca-certificates cmake curl file git \
            libicu-dev libssl-dev libz-dev libzstd-dev pkg-config sbcl
          mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg |
            tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" |
            tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes gh
          git config --system --add safe.directory '*'

      - uses: actions/checkout@v5

      - name: Configure safe directory
        run: git config --global --add safe.directory '*'

      - name: Install Rust
        run: |
          curl --fail --location --show-error --retry 3 --proto '=https' --tlsv1.2 \
            https://sh.rustup.rs |
            sh -s -- -y --default-toolchain 1.97.1 --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Package Linux release
        env:
          AUTOLITH_HOST_BOOTSTRAP: "1"
        run: ./script/ci-package-release dist/

      - name: Validate Linux release
        run: |
          ./script/validate-linux-release-artifact \
            dist/autolith-"$GITHUB_REF_NAME"-aarch64-linux.tar.gz \
            aarch64-linux aarch64 /lib/ld-linux-aarch64.so.1

      - name: Upload Linux release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/autolith-"$GITHUB_REF_NAME"-aarch64-linux.tar.gz \
            dist/autolith-"$GITHUB_REF_NAME"-aarch64-linux.tar.gz.sha256 \
            --clobber

  package-linux-x86_64-musl:
    name: Package Linux x86-64 (musl)
    needs: publish-metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Package and validate Linux musl release
        run: |
          docker run --rm -e GITHUB_REF_NAME -v "$PWD":/workspace -w /workspace \
            alpine:3.22.5@sha256:7c8cb692ae09657cbc4a3f3cbd0e8d5a2690ba38386aaaf252dbb060bf5eb2e6 \
            sh -c '
              set -eu
              apk add --no-cache bash binutils build-base bubblewrap ca-certificates cmake \
                coreutils curl file git grep icu-dev linux-headers openssl-dev \
                openssl-libs-static pkgconfig sbcl tar zlib-dev zlib-static zstd-dev zstd-static
              curl --fail --location --show-error --retry 3 --proto "=https" --tlsv1.2 \
                https://sh.rustup.rs |
                sh -s -- -y --default-toolchain 1.97.1 --profile minimal
              export PATH=/root/.cargo/bin:$PATH
                export RUSTUP_TOOLCHAIN=1.97.1
              git config --global --add safe.directory "*"
              AUTOLITH_HOST_BOOTSTRAP=1 ./script/ci-package-release dist/
              ./script/validate-linux-release-artifact \
                dist/autolith-"$GITHUB_REF_NAME"-x86_64-linux-musl.tar.gz \
                x86_64-linux-musl x86_64 static
            '

      - name: Upload Linux musl release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/autolith-"$GITHUB_REF_NAME"-x86_64-linux-musl.tar.gz \
            dist/autolith-"$GITHUB_REF_NAME"-x86_64-linux-musl.tar.gz.sha256 \
            --clobber

  package-linux-aarch64-musl:
    name: Package Linux aarch64 (musl)
    needs: publish-metadata
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Package and validate Linux musl release
        run: |
          docker run --rm -e GITHUB_REF_NAME -v "$PWD":/workspace -w /workspace \
            alpine:3.22.5@sha256:2c9d26f410d032d5b1525aa8a873e238b05b90c4ae8618743d4311f0cc827e37 \
            sh -c '
              set -eu
              apk add --no-cache bash binutils build-base bubblewrap ca-certificates cmake \
                coreutils curl file git grep icu-dev linux-headers openssl-dev \
                openssl-libs-static pkgconfig sbcl tar zlib-dev zlib-static zstd-dev zstd-static
              curl --fail --location --show-error --retry 3 --proto "=https" --tlsv1.2 \
                https://sh.rustup.rs |
                sh -s -- -y --default-toolchain 1.97.1 --profile minimal
              export PATH=/root/.cargo/bin:$PATH
                export RUSTUP_TOOLCHAIN=1.97.1
              git config --global --add safe.directory "*"
              AUTOLITH_HOST_BOOTSTRAP=1 ./script/ci-package-release dist/
              ./script/validate-linux-release-artifact \
                dist/autolith-"$GITHUB_REF_NAME"-aarch64-linux-musl.tar.gz \
                aarch64-linux-musl aarch64 static
            '

      - name: Upload Linux musl release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/autolith-"$GITHUB_REF_NAME"-aarch64-linux-musl.tar.gz \
            dist/autolith-"$GITHUB_REF_NAME"-aarch64-linux-musl.tar.gz.sha256 \
            --clobber
  package-macos-arm64:
    name: Package macOS arm64
    needs: publish-metadata
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install rust gnu-tar

      - name: Package macOS release
        run: ./script/ci-package-release dist/

      - name: Upload macOS release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/autolith-"$GITHUB_REF_NAME"-arm64-darwin.tar.gz \
            dist/autolith-"$GITHUB_REF_NAME"-arm64-darwin.tar.gz.sha256 \
            --clobber

  package-macos-x86_64:
    name: Package macOS x86-64
    needs: publish-metadata
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install rust gnu-tar sbcl

      - name: Package macOS release
        run: ./script/ci-package-release dist/

      - name: Upload macOS release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/autolith-"$GITHUB_REF_NAME"-x86_64-darwin.tar.gz \
            dist/autolith-"$GITHUB_REF_NAME"-x86_64-darwin.tar.gz.sha256 \
            --clobber

  package-freebsd-x86_64:
    name: Package FreeBSD x86-64
    needs: publish-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Package FreeBSD release
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15"
          mem: 8192
          cache-after-prepare: true
          prepare: |
            set -eu
            pkg install -y bash curl git gmake rust cmake zstd sbcl pkgconf coreutils gtar icu openssl
          run: |
            set -eu
            export PATH="$HOME/bin:/usr/local/bin:$PATH"
            ./script/ci-package-release dist/

      - name: Upload FreeBSD release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/autolith-"$GITHUB_REF_NAME"-x86_64-freebsd.tar.gz \
            dist/autolith-"$GITHUB_REF_NAME"-x86_64-freebsd.tar.gz.sha256 \
            --clobber

  package-netbsd-x86_64:
    name: Package NetBSD x86-64
    needs: publish-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Package NetBSD release
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10"
          mem: 8192
          cache-after-prepare: true
          prepare: |
            set -eu
            if command -v pkgin >/dev/null 2>&1; then
                pkgin -y install bash curl git gmake rust cmake zstd sbcl pkgconf coreutils gtar icu mozilla-rootcerts
              else
                pkg_add bash curl git gmake rust cmake zstd sbcl pkgconf coreutils gtar icu mozilla-rootcerts
              fi
              if [ ! -d /etc/openssl/certs ] || [ -z "$(ls -A /etc/openssl/certs 2>/dev/null)" ]; then
                mozilla-rootcerts install
              fi
          run: |
            set -eu
            export PATH="$HOME/bin:/usr/pkg/bin:/usr/local/bin:$PATH"
            ./script/ci-package-release dist/

      - name: Upload NetBSD release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/autolith-"$GITHUB_REF_NAME"-x86_64-netbsd.tar.gz \
            dist/autolith-"$GITHUB_REF_NAME"-x86_64-netbsd.tar.gz.sha256 \
            --clobber

  package-openbsd-x86_64:
    name: Package OpenBSD x86-64
    needs: publish-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Package OpenBSD release
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          mem: 8192
          cache-after-prepare: true
          prepare: |
            set -eu
            pkg_add bash curl git gmake rust cmake zstd sbcl coreutils gtar-- icu4c
          run: |
              set -eu
              export HOME=/tmp/autolith-home
              mkdir -p "$HOME"
              for mountpoint in / /usr/local /home /tmp; do
                if mount | grep " $mountpoint "; then
                  mount -u -o wxallowed "$mountpoint" || true
                fi
              done
              export PATH="$HOME/bin:/usr/local/bin:$PATH"
              ./script/ci-package-release dist/

      - name: Upload OpenBSD release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/autolith-"$GITHUB_REF_NAME"-x86_64-openbsd.tar.gz \
            dist/autolith-"$GITHUB_REF_NAME"-x86_64-openbsd.tar.gz.sha256 \
            --clobber

  package-windows-x86_64:
    name: Package Windows x86-64
    needs: publish-metadata
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        shell: pwsh
        run: |
          choco install llvm cmake make --yes --no-progress
          if (-not (Get-Command cargo.exe -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
            & "$env:RUNNER_TEMP\rustup-init.exe" -y --profile minimal --default-toolchain 1.97.1
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: Bootstrap and check
        shell: pwsh
        run: |
          script\bootstrap.ps1
          script\check.ps1 --jobs 4

      - name: Package Windows release
        shell: pwsh
        run: script\package-windows-release.ps1 -OutputDirectory dist -Tag $env:GITHUB_REF_NAME

      - name: Validate Windows release
        shell: pwsh
        run: script\validate-windows-release-artifact.ps1 -Archive (Get-ChildItem dist\*.zip).FullName

      - name: Upload Windows release artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME dist/*.zip dist/*.zip.sha256 --clobber
